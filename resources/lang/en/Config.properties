FeedbackSettingsTab=Settings
releaseFeedbacks=Automatically publish reviews
doNotRelease=No
releaseAuthenticated=Only for logged-in users
releaseAll=Yes
allowGuestFeedbacks=Allow reviews by guests without order
showEmptyRatingsInCategoryViewLabel=Show empty star ratings in the category view
showRatingCountInCategoryViewLabel=Show number of reviews in the category view
showRatingFacetLabel=Show rating filter
showRatingSortingLabel=Show sorting option in item lists
allowFeedbacksOnlyIfPurchased = Only allow reviews after purchase
numberOfFeedbacks = Maximum number of reviews per author and item
showEmptyRatingsInOrderConfirmationViewLabel=Show empty star ratings in the order confirmation view
SchemaSettingsTab=Structured product data
schemaProductOfferEnabled=Render Product/ProductGroup/Offer JSON-LD server-side
schemaDisableCeresProduct=Disable the Ceres Product schema on item pages
schemaFaqPropertyId=Property ID for FAQPage (default: 151)
schemaSellerName=Seller in Offer schema
schemaManufacturerName=Manufacturer in Product schema (authoritative; empty = automatic)
schemaVariesBy=Variant dimensions, comma-separated (e.g. size,color)
schemaShippingPolicy=Output shipping details in Offer schema
schemaShippingCountries=Shipping countries, comma-separated ISO codes
schemaShippingFallbackEnabled=Use configured shipping price when PlentyONE omits default shipping costs
schemaShippingProfilePrices=Shipping-profile fallback prices (e.g. 6=6.90; 9=59.00)
schemaShippingPackagePrice=Fallback parcel shipping price (blank = no output)
schemaShippingFreightPrice=Fallback freight shipping price (blank = no output)
schemaShippingFreightWeightThresholdKg=Use freight at gross weight in kg
schemaShippingFreightProfileIds=Freight shipping profile IDs, comma-separated
schemaHandlingTimeMin=Minimum handling time (days)
schemaHandlingTimeMax=Maximum handling time (days)
schemaTransitTimeMin=Minimum transit time (days)
schemaTransitTimeMax=Maximum transit time (days)
schemaReturnPolicy=Output return policy on seller
schemaReturnCountries=Return-policy countries, comma-separated ISO codes
schemaReturnDays=Return window in days
schemaReturnPolicyUrl=Cancellation or return policy URL (blank = /widerrufsrecht/)
schemaVideoFromProperties=Automatically build VideoObject from item properties
schemaVideoYoutubePropertyId=Property ID(s) for YouTube video ID, comma-separated (default: 110)
schemaVideoUploadDatePropertyId=Property ID(s) for video upload date, comma-separated (default: 158)
